{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учёт отпусков{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="{% static 'homepage/css/style.css' %}"
        rel="stylesheet"
    >
</head>
<body>
    <header class="site-header py-3 mb-4">
        <div class="container">
            <a
                class="brand-link"
                href="{% url 'homepage:index' %}"
            >
                <img
                    class="brand-logo"
                    src="{% static 'homepage/img/logo.svg' %}"
                    alt="Логотип сервиса учёта отпусков"
                    width="52"
                    height="52"
                >
                <span>Учёт отпусков</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container site-footer mt-5 py-3">
        <p class="mb-0">
            © <span id="current-year"></span> Сервис учёта отпусков
        </p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
